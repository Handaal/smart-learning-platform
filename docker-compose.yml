services:
  # ── PostgreSQL + TimescaleDB ─────────────────────────────────
  db:
    image: timescale/timescaledb:2.28.3-pg15
    container_name: step_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-step_db}
      POSTGRES_USER:     ${POSTGRES_USER:-step_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Loopback-only: Docker publishes bypass ufw, so a bare "5433:5432"
    # would expose Postgres to the public internet on a Hostinger VPS.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-step_user} -d ${POSTGRES_DB:-step_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: step_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: step_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:  production
      PORT:      3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-step_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-step_db}
      REDIS_URL:    redis://redis:6379
      JWT_SECRET:   ${JWT_SECRET:?JWT_SECRET is required}
      # Same-origin deployment (nginx proxies /api), so this only matters
      # if you point a different host at the API.
      CORS_ORIGIN:  ${CORS_ORIGIN:-http://localhost}
      # true => run the Prisma seed (idempotent upserts) on container start.
      SEED_ON_START:      ${SEED_ON_START:-false}
      AI_SERVICE_URL:     ${AI_SERVICE_URL:-http://ai-services:8000}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-dev-key}
    # Not published publicly — reachable only through the frontend's nginx.
    expose:
      - "3001"
    volumes:
      - backend_logs:/app/logs
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  # ── Frontend (static production build served by nginx) ───────
  # Built from the repo root because the build also needs
  # backend/src/policy (the @policy alias in vite.config.ts).
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty => the app uses relative /api and /ws on its own origin.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
    container_name: step_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

  # ── AI Services (optional) ───────────────────────────────────
  # Excluded from the default deploy. Enable with:
  #   docker compose --profile ai up -d
  ai-services:
    profiles: ["ai"]
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: step_ai
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-step_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-step_db}
      API_KEY:      ${AI_SERVICE_API_KEY:-dev-key}
    expose:
      - "8000"

volumes:
  db_data:
  redis_data:
  backend_logs:
  uploads_data:
