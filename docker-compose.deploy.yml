# ─────────────────────────────────────────────────────────────
# PASTE-INTO-HOSTINGER compose file.
#
# The Docker Manager panel has no repo checkout on the server, so this file
# is fully self-contained: registry images only, no build contexts, no bind
# mounts to host paths. Images are published by
# .github/workflows/publish-images.yml on every push to main.
#
# Before pasting, replace every CHANGE_ME below.
#   REGISTRY_OWNER  -> your GitHub owner, lowercase (e.g. handaal)
#   POSTGRES_PASSWORD / JWT_SECRET -> real secrets (openssl rand -hex 48)
#   CORS_ORIGIN     -> https://<hostname>  (must match the Traefik Host rule)
#   PUBLIC_HOSTNAME -> e.g. 203-0-113-45.sslip.io (free hostname, no domain
#                      needed; sslip.io resolves it to that IP)
#
# For SSH-based deploys that build on the box, use docker-compose.yml instead.
# ─────────────────────────────────────────────────────────────
services:
  db:
    image: timescale/timescaledb:2.28.3-pg15
    container_name: step_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       step_db
      POSTGRES_USER:     step_user
      POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U step_user -d step_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: step_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/CHANGE_ME_REGISTRY_OWNER/step-backend:latest
    container_name: step_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:     production
      PORT:         3001
      LOG_LEVEL:    info
      DATABASE_URL: postgresql://step_user:CHANGE_ME_POSTGRES_PASSWORD@db:5432/step_db
      REDIS_URL:    redis://redis:6379
      JWT_SECRET:   CHANGE_ME_JWT_SECRET
      # Set to "true" for the first deploy to load reference data, then
      # back to "false". The seed uses upserts, so re-running is harmless.
      SEED_ON_START: "true"
      # Creates the three demo accounts (EXP…/CTL…/RADMIN…). Turn off once
      # real accounts exist; set DEMO_USER_PASSWORD to avoid the repo default.
      SEED_DEMO_USERS: "true"
      DEMO_USER_PASSWORD: CHANGE_ME_DEMO_PASSWORD
      CORS_ORIGIN:  CHANGE_ME_PUBLIC_ORIGIN
    expose:
      - "3001"
    volumes:
      - backend_logs:/app/logs
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  # nginx: serves the static build and proxies /api, /uploads, /ws to backend.
  frontend:
    image: ghcr.io/CHANGE_ME_REGISTRY_OWNER/step-frontend:latest
    container_name: step_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Host port 80 is often already taken on a Hostinger VPS (panel nginx).
    # Use 8080 and put a host reverse proxy in front for TLS.
    ports:
      - "8080:80"
    # Routed by the host Traefik (entrypoints web/websecure, resolver
    # "letsencrypt"). exposedbydefault=false there, so traefik.enable is
    # required. server.port is the port INSIDE the container (nginx), not the
    # published 8080 — that stays as a direct fallback.
    # Multiple hosts (Traefik v3): OR them, e.g.
    #   Host(`a.com`) || Host(`www.a.com`). Comma-separated args are v2 only.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.step.rule=Host(`CHANGE_ME_PUBLIC_HOSTNAME`)"
      - "traefik.http.routers.step.entrypoints=websecure"
      - "traefik.http.routers.step.tls.certresolver=letsencrypt"
      - "traefik.http.services.step.loadbalancer.server.port=80"

volumes:
  db_data:
  redis_data:
  backend_logs:
  uploads_data:
