server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Uploaded artifacts and model assets can be large.
  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Resolve the backend container lazily via Docker's embedded DNS. With a
  # literal upstream, nginx refuses to start whenever the backend container
  # is not yet resolvable — which turns a slow backend boot into an nginx
  # crash-loop. The variable form defers resolution to request time.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream backend;

  # Hashed build assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA entry — index.html itself must never be cached, or clients keep
  # loading asset hashes that no longer exist after a redeploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass         http://$backend_upstream:3001$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    proxy_pass         http://$backend_upstream:3001$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # socket.io lives at /ws/emotion (see frontend/src/services/emotionTracker.ts)
  location /ws/ {
    proxy_pass         http://$backend_upstream:3001$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
